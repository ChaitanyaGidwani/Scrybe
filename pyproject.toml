[project]
name = "scrybe"
version = "0.2.0"
description = "Autonomous Multi-Agent Web Intelligence & Market Synthesis System with A2A Protocol"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Chaitanya Gidwani" },
]
keywords = ["competitive-intelligence", "multi-agent", "a2a-protocol", "web-scraping", "llm", "pricing-intelligence"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Data Validation & State
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",

    # Network & Tiered Scraping
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",

    # Web Framework & API
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "websockets>=12.0",

    # Storage
    "SQLAlchemy>=2.0.30",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
llm = [
    "openai>=1.30.0",
    "anthropic>=0.28.0",
    "google-generativeai>=0.5.0",
    "tiktoken>=0.7.0",
]
scraping = [
    "curl_cffi>=0.7.0",
    "playwright>=1.44.0",
    "crawl4ai>=0.4.0",
]
reporting = [
    "reportlab>=4.2.0",
    "python-docx>=1.1.2",
    "plotly>=5.22.0",
]
vector = [
    "faiss-cpu>=1.8.0",
    "numpy>=1.26.0",
]
all = [
    "scrybe[llm,scraping,reporting,vector]",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.5",
    "mypy>=1.10.0",
]

[project.scripts]
scrybe = "cli:main"

[project.urls]
Homepage = "https://github.com/ChaitanyaGidwani/Scrybe"
Documentation = "https://github.com/ChaitanyaGidwani/Scrybe/tree/main/docs"
Repository = "https://github.com/ChaitanyaGidwani/Scrybe"
Issues = "https://github.com/ChaitanyaGidwani/Scrybe/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scrybe", "config"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
