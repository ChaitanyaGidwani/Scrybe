version: "3.9"

services:
  # ── Scrybe API Server ──
  api:
    build: .
    container_name: scrybe-api
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./config:/app/config
    depends_on:
      - redis
    restart: unless-stopped
    command: ["python", "-m", "uvicorn", "scrybe.api.main:app", "--host", "0.0.0.0", "--port", "8000"]

  # ── Scrybe Streamlit Dashboard ──
  dashboard:
    build: .
    container_name: scrybe-dashboard
    ports:
      - "8501:8501"
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./config:/app/config
    depends_on:
      - api
    restart: unless-stopped
    command: ["streamlit", "run", "scrybe/dashboard/app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]

  # ── Redis (Cache & Job Queue) ──
  redis:
    image: redis:7-alpine
    container_name: scrybe-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
